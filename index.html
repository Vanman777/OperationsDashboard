<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Brand Operations Command Centre</title>
<style>
:root{--bg:#090a0d;--panel:rgba(20,20,28,.72);--line:rgba(255,255,255,.14);--text:#fff;--muted:#aeb3bd;--cb:#ff4651;--rr:#68d391;--blue:#6da8ff;--amber:#ffa245;--green:#2ee59d}
*{box-sizing:border-box}body{margin:0;background:#090a0d;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 12%,rgba(172,35,44,.18),transparent 32%),radial-gradient(circle at 80% 14%,rgba(43,100,67,.2),transparent 34%);z-index:-1}.wrap{width:min(1600px,calc(100% - 24px));margin:auto;padding:12px 0 28px}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 9px 28px rgba(0,0,0,.34);backdrop-filter:blur(18px);border-radius:20px}.hero{padding:25px 28px;background:linear-gradient(120deg,rgba(137,27,34,.82),rgba(35,76,52,.75),rgba(20,20,28,.75));display:flex;gap:18px;align-items:center}.hero-icon{font-size:42px}.hero h1{margin:0;font-size:clamp(25px,3vw,38px)}.hero p{margin:8px 0 0;color:#e1e4e8;font-weight:650}.fresh{margin-left:auto;text-align:right;color:#cdd2d8;font-size:12px}.bar{padding:14px 18px;margin-top:14px;font-size:18px;font-weight:900}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}.metric{min-height:105px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.metric .icon{font-size:25px}.metric span{font-size:12px;font-weight:800;margin-top:5px}.metric strong{font-size:18px;margin-top:5px}.blue{background:rgba(36,71,145,.4);border-color:rgba(90,155,255,.62)}.amber{background:rgba(155,82,18,.43);border-color:rgba(255,156,65,.62)}.green{background:rgba(19,110,74,.4);border-color:rgba(70,220,145,.58)}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}.brand-head{padding:14px 18px;font-size:18px;font-weight:900}.brand.cb .brand-head{border-color:rgba(255,70,81,.32)}.brand.rr .brand-head{background:rgba(24,57,40,.76);border-color:rgba(104,211,145,.33)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.product{min-height:130px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:center}.product strong{font-size:19px;margin:5px 0}.product small{color:var(--muted)}.brand.cb .accent{color:var(--cb)}.brand.rr .accent{color:var(--rr)}.orders{margin-top:10px;display:grid;gap:10px}.order{padding:17px}.order.cb{border-color:rgba(255,70,81,.3)}.order.rr{border-color:rgba(104,211,145,.32)}.order-top{display:flex;justify-content:space-between;gap:14px}.oid{font-weight:900}.customer{color:var(--muted);font-size:12px;margin-top:4px}.amount{font-size:18px;font-weight:900}.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pill{font-size:10px;font-weight:900;padding:5px 9px;border-radius:999px;border:1px solid}.paid{color:#c8ffe6;background:rgba(35,209,139,.18);border-color:rgba(70,220,145,.48)}.awaiting{color:#ffe0c2;background:rgba(255,157,66,.16);border-color:rgba(255,156,65,.48)}.neutral{color:#d4e4ff;background:rgba(109,168,255,.13);border-color:rgba(90,155,255,.36)}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.details div{background:rgba(0,0,0,.17);padding:10px;border-radius:11px}.details span{display:block;color:#949aa5;font-size:10px}.details strong{display:block;font-size:11px;margin-top:4px}.empty{padding:32px;text-align:center;color:var(--muted)}.error{display:none;margin-top:14px;padding:14px;border:1px solid rgba(255,80,90,.6);background:rgba(145,24,31,.4);border-radius:14px}.footer{text-align:center;color:#747b86;font-size:11px;padding-top:20px}@media(max-width:950px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.fresh{display:none}}@media(max-width:520px){.grid4,.stats,.products,.details{grid-template-columns:1fr}.hero{padding:20px}.hero-icon{font-size:32px}.order-top{flex-direction:column}.wrap{width:min(100% - 14px,1600px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero glass"><div class="hero-icon">▣</div><div><h1>Multi-Brand Operations Command Centre</h1><p id="heroLine">Loading live operations data…</p></div><div class="fresh"><div>READ ONLY</div><div id="updated">Connecting…</div></div></header>
  <div id="error" class="error"></div>
  <div class="bar glass">Combined Operations Overview</div>
  <section class="grid4" id="overview"></section>
  <div class="bar glass">Inventory Overview</div>
  <main class="two"><section class="brand cb" id="cbInventory"></section><section class="brand rr" id="rrInventory"></section></main>
  <div class="bar glass">Active Orders</div>
  <section class="two"><div class="brand cb"><div class="brand-head glass">🌶 Active ChilliBoyz Orders</div><div class="orders" id="cbOrders"></div></div><div class="brand rr"><div class="brand-head glass">🌿 Active Rooted Ritual Orders</div><div class="orders" id="rrOrders"></div></div></section>
  <div class="footer">Read-only operations view • Automatically refreshes every 60 seconds</div>
</div>
<script>
const API_URL = 'PASTE_PUBLIC_OPERATIONS_URL_HERE';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v)||0);
const label=v=>String(v||'UNKNOWN').replaceAll('_',' ');
function metric(name,value,kind='blue',icon='●'){return `<div class="metric glass ${kind}"><div class="icon">${icon}</div><span>${esc(name)}</span><strong>${esc(value)}</strong></div>`}
function inventory(b,key){const rr=key==='ROOTED_RITUAL';const cls=rr?'rr':'cb';const products=(b.products||[]).map(p=>`<div class="product glass"><div class="accent">${rr?'🌿':'◆'}</div><span>${esc(p.productName)}</span><strong>${esc(p.availableStock)} available</strong><small>On hand: ${esc(p.stockOnHand)} • Reserved: ${esc(p.reservedStock)}</small></div>`).join('');return `<div class="brand-head glass">${rr?'🌿 Rooted Ritual Inventory':'🌶 ChilliBoyz Inventory'}</div><div class="stats">${metric('On Hand',b.summary.stockOnHand,'','▦')}${metric('Reserved',b.summary.reservedStock,'amber','◇')}${metric('Available',b.summary.availableStock,'green','⬡')}</div><div class="products">${products}</div>`}
function order(o,cls){const paid=String(o.paymentStatus).toUpperCase()==='PAID';return `<article class="order glass ${cls}"><div class="order-top"><div><div class="oid">${esc(o.orderId)}</div><div class="customer">${esc(o.customerName)}</div></div><div class="amount">${money(o.orderTotal)}</div></div><div class="pills"><span class="pill ${paid?'paid':'awaiting'}">${esc(label(o.paymentStatus))}</span><span class="pill neutral">${esc(label(o.orderStatus))}</span><span class="pill neutral">${esc(label(o.deliveryMethod))}</span></div><div class="details"><div><span>${paid?'Payment':'Payment due'}</span><strong>${paid?'Paid':esc(o.paymentDueDate||'Not set')}</strong></div><div><span>${paid?'Stock allocation':'Reserved until'}</span><strong>${paid?'Stock secured':esc(o.reservationExpiry||'Not set')}</strong></div></div></article>`}
function draw(data){const cb=data.businesses.CHILLIBOYZ,rr=data.businesses.ROOTED_RITUAL;if(!cb||!rr)throw new Error('Both business datasets were not returned.');$('heroLine').textContent=`ChilliBoyz: ${cb.summary.activeOrders} active • ${cb.summary.availableStock} available | Rooted Ritual: ${rr.summary.activeOrders} active • ${rr.summary.availableStock} available`;$('updated').textContent='Updated '+new Date(data.generatedAt).toLocaleString('en-ZA');$('overview').innerHTML=metric('ChilliBoyz Active',cb.summary.activeOrders,'blue','🌶')+metric('CB Awaiting Payment',cb.summary.awaitingPayment,'amber','◷')+metric('Rooted Ritual Active',rr.summary.activeOrders,'blue','🌿')+metric('RR Awaiting Payment',rr.summary.awaitingPayment,'amber','◷');$('cbInventory').innerHTML=inventory(cb,'CHILLIBOYZ');$('rrInventory').innerHTML=inventory(rr,'ROOTED_RITUAL');$('cbOrders').innerHTML=cb.orders.length?cb.orders.map(o=>order(o,'cb')).join(''):'<div class="empty glass">No active ChilliBoyz orders</div>';$('rrOrders').innerHTML=rr.orders.length?rr.orders.map(o=>order(o,'rr')).join(''):'<div class="empty glass">No active Rooted Ritual orders</div>';}
async function load(){const e=$('error');e.style.display='none';try{if(API_URL.includes('PASTE_'))throw new Error('The publicOperations API URL has not been inserted yet.');const r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error(`API returned HTTP ${r.status}`);const d=await r.json();if(!d.success||d.readOnly!==true)throw new Error('Unexpected API response.');draw(d)}catch(err){e.textContent='Dashboard data could not be loaded: '+err.message;e.style.display='block'}}
load();setInterval(load,60000);
</script>
</body>
</html>
